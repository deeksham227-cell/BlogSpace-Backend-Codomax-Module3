<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>BlogSpace | Login</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

    <!-- Logo -->

    <a href="index.html"
       class="logo auth-logo">

        Blog<span>Space</span>

    </a>


    <!-- Login Card -->

    <main class="auth-card">

        <p class="eyebrow">
            WELCOME BACK
        </p>

        <h1>
            Sign in to your account
        </h1>

        <p class="muted">
            Continue writing and sharing your ideas.
        </p>


        <!-- Login Form -->

        <form id="loginForm">


            <!-- Email -->

            <label for="loginEmail">
                Email Address
            </label>

            <input
                type="email"
                id="loginEmail"
                name="email"
                placeholder="you@example.com"
                autocomplete="email"
                required
            >


            <!-- Password -->

            <label for="loginPassword">
                Password
            </label>

            <input
                type="password"
                id="loginPassword"
                name="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >


            <!-- Login Button -->

            <button
                class="btn full"
                type="submit">

                Login

            </button>

        </form>


        <!-- Register Link -->

        <p class="switch">

            Don't have an account?

            <a href="register.html">
                Create one
            </a>

        </p>


        <!-- Home Link -->

        <a href="index.html"
           class="back-link">

            ← Back to Home

        </a>

    </main>


    <!-- JavaScript -->

    <script src="js/script.js"></script>

</body>

</html>
