<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>BlogSpace | Register</title>

    <link rel="stylesheet"
          href="css/style.css">
</head>


<body class="auth-page">


    <!-- Logo -->

    <a href="index.html"
       class="logo auth-logo">

        Blog<span>Space</span>

    </a>


    <!-- Registration Card -->

    <main class="auth-card">

        <p class="eyebrow">
            GET STARTED
        </p>


        <h1>
            Create your account
        </h1>


        <p class="muted">
            Join BlogSpace and start sharing your stories.
        </p>


        <!-- Registration Form -->

        <form id="registerForm">


            <!-- Full Name -->

            <label for="name">
                Full Name
            </label>

            <input
                type="text"
                id="name"
                placeholder="Your name"
                required
            >


            <!-- Email -->

            <label for="email">
                Email Address
            </label>

            <input
                type="email"
                id="email"
                placeholder="you@example.com"
                required
            >


            <!-- Password -->

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Create a password"
                required
            >


            <!-- Confirm Password -->

            <label for="confirmPassword">
                Confirm Password
            </label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="Repeat your password"
                required
            >


            <!-- Register Button -->

            <button
                class="btn full"
                type="submit">

                Create Account

            </button>

        </form>


        <!-- Login Link -->

        <p class="switch">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </p>


        <!-- Home Link -->

        <a href="index.html"
           class="back-link">

            ← Back to Home

        </a>

    </main>


    <!-- JavaScript -->

    <script src="js/script.js"></script>

</body>

</html>
