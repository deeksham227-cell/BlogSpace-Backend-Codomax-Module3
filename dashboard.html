<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>BlogSpace | Dashboard</title>

    <link rel="stylesheet"
          href="css/style.css">
</head>

<body>

    <!-- Navigation Bar -->

    <header class="navbar">

        <a href="index.html"
           class="logo">

            Blog<span>Space</span>

        </a>

        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="dashboard.html"
               class="active">
                Dashboard
            </a>

            <a href="create-blog.html">
                Create Blog
            </a>

            <a href="login.html"
               class="nav-btn">
                Logout
            </a>

        </nav>

    </header>


    <!-- Dashboard -->

    <main class="dashboard section">

        <!-- Dashboard Header -->

        <div class="dashboard-top">

            <div>

                <p class="eyebrow">
                    YOUR WORKSPACE
                </p>

                <h1>
                    Dashboard
                </h1>

                <p class="muted">
                    Manage your published stories and create
                    something new.
                </p>

            </div>

            <a href="create-blog.html"
               class="btn">

                + Create Blog

            </a>

        </div>


        <!-- Statistics -->

        <div class="stats">

            <div class="stat">

                <strong id="totalPosts">
                    0
                </strong>

                <span>
                    Total Posts
                </span>

            </div>


            <div class="stat">

                <strong>
                    0
                </strong>

                <span>
                    Total Views
                </span>

            </div>


            <div class="stat">

                <strong>
                    0
                </strong>

                <span>
                    Likes
                </span>

            </div>

        </div>


        <!-- Posts -->

        <div class="table-card">

            <div class="section-heading">

                <h2>
                    Your Posts
                </h2>

            </div>

            <!-- MongoDB blogs will appear here -->

            <div id="blogsContainer">

                <p class="muted">
                    Loading blogs...
                </p>

            </div>

        </div>

    </main>


    <!-- Footer -->

    <footer>

        <p>
            © 2026 BlogSpace. Built with HTML, CSS & JavaScript.
        </p>

    </footer>


    <!-- JavaScript -->

    <script src="js/script.js"></script>

</body>

</html>
